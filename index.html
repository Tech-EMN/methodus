<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methodus - Validação de Relatórios</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .upload-section, .result-section { margin-top: 30px; }
        .result-section { display: none; }
        
        .file-upload-box { border: 2px dashed #3498db; padding: 30px; text-align: center; border-radius: 8px; background: #ebf5fb; margin-bottom: 20px; }
        input[type="file"] { display: block; margin: 0 auto 20px; font-size: 16px; }
        
        button { background-color: #3498db; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 5px; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        .btn-approve { background-color: #2ecc71; }
        .btn-approve:hover { background-color: #27ae60; }
        .btn-reject { background-color: #e74c3c; }
        .btn-reject:hover { background-color: #c0392b; }
        
        /* Sistema de Abas */
        .tab-bar { display: flex; overflow-x: auto; border-bottom: 2px solid #bdc3c7; margin-bottom: 20px; padding-bottom: 5px; align-items: center; }
        .tab-button { background-color: #ecf0f1; color: #7f8c8d; padding: 10px 35px 10px 15px; margin-right: 5px; border-radius: 5px 5px 0 0; font-size: 14px; white-space: nowrap; cursor: pointer; position: relative; border: none; outline: none; }
        .tab-button.active { background-color: #2c3e50; color: #fff; font-weight: bold; }
        .tab-button.loading { cursor: not-allowed; padding-right: 15px; opacity: 0.8; }
        
        /* Botão Fechar (x) */
        .close-tab { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #e74c3c; font-weight: bold; cursor: pointer; font-size: 16px; line-height: 1; }
        .close-tab:hover { color: #c0392b; transform: translateY(-50%) scale(1.2); }
        
        /* Botão Adicionar (+) */
        .add-tab-btn { background-color: #27ae60; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 5px; flex-shrink: 0; padding: 0;}
        .add-tab-btn:hover { background-color: #2ecc71; transform: scale(1.1); }
        
        /* Spinner de Carregamento */
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.2); border-radius: 50%; border-top-color: #3498db; animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tab-button.active .spinner { border-top-color: #fff; border-color: rgba(255,255,255,0.3); border-top-color: #fff; }

        /* Formulários e Tabelas */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .data-table th { background-color: #34495e; color: white; padding: 10px; text-align: left; border: 1px solid #ddd; }
        .data-table td { border: 1px solid #ddd; padding: 5px; }
        .data-table input[type="text"] { border: none; background-color: #f9f9f9; }
        .data-table input[type="text"]:focus { background-color: #fff; outline: 1px solid #3498db; }
        
        .actions { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Análise de Relatórios - Methodus</h1>
    
    <div class="upload-section" id="uploadSection">
        <div class="file-upload-box">
            <p>Selecione um ou múltiplos extratos (PDF/Excel) do Domínio.</p>
            <input type="file" id="fileInput" accept=".pdf, .xlsx, .xls" multiple>
            <button onclick="startInitialProcessing()">Iniciar Análise em Lote</button>
        </div>
    </div>

    <div class="result-section" id="resultSection">
        <div class="tab-bar" id="tabBar">
            <button class="add-tab-btn" id="addTabBtn" title="Adicionar mais extratos" onclick="document.getElementById('addMoreInput').click()">+</button>
            <input type="file" id="addMoreInput" accept=".pdf, .xlsx, .xls" multiple style="display: none;" onchange="processMoreFiles()">
        </div>
        
        <div id="tabsContainer"></div>

        <div class="actions" id="actionButtons" style="display: none;">
            <button class="btn-approve" onclick="sendDecision('Aprovado')">Aprovar Aba Atual</button>
            <button class="btn-reject" onclick="sendDecision('Recusado')">Descartar Aba Atual</button>
        </div>
        <div class="loader" id="actionLoader" style="display: none;">Enviando decisão para o n8n...</div>
    </div>
</div>

<script>
    // URLs dos Webhooks do n8n

    const N8N_URL_ANALYZE = "https://n8n.servidoremn.site/webhook/analise-documento";
    const N8N_URL_DECISION = "https://n8n.servidoremn.site/webhook/decisao-relatorio";
    
    let allExtractedData = {};
    let activeTabId = null;
    let globalFileIndex = 0; // Garante IDs únicos mesmo adicionando arquivos novos depois

    // Inicia o processo da tela inicial
    function startInitialProcessing() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert('Por favor, selecione ao menos um arquivo.');
            return;
        }
        document.getElementById('uploadSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
        processFiles(fileInput.files);
    }

    // Processa arquivos adicionados pelo botão (+)
    function processMoreFiles() {
        const addMoreInput = document.getElementById('addMoreInput');
        if (addMoreInput.files.length > 0) {
            processFiles(addMoreInput.files);
            addMoreInput.value = ''; // Reseta o input para permitir selecionar o mesmo arquivo novamente se necessário
        }
    }

    // Motor principal de processamento sequencial
    async function processFiles(files) {
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileId = `file_${globalFileIndex++}`;
            
            // 1. Cria a aba visualmente no estado de "Carregando"
            createLoadingTab(fileId, file.name);

            const formData = new FormData();
            formData.append('file', file);

            try {
                // 2. Envia para o n8n
                const response = await fetch(N8N_URL_ANALYZE, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Erro na análise');
                
                const data = await response.json();
                const extractedText = Array.isArray(data) ? data[0].text || data[0] : data.text || data;
                let parsedData = typeof extractedText === 'string' ? JSON.parse(extractedText) : extractedText;

                // 3. Salva os dados estruturados
                allExtractedData[fileId] = {
                    fileName: file.name,
                    data: parsedData
                };

                // 4. Atualiza a aba com sucesso e gera o formulário
                updateTabSuccess(fileId, file.name, parsedData);
                
                // Exibe os botões de ação se for a primeira aba sendo carregada com sucesso
                document.getElementById('actionButtons').style.display = 'block';
                
                // Se for a única aba ativa no momento (ou a primeira), muda o foco para ela
                if (!activeTabId || Object.keys(allExtractedData).length === 1) {
                    switchTab(fileId);
                }

            } catch (error) {
                console.error(`Erro ao processar ${file.name}:`, error);
                updateTabError(fileId, file.name);
            }
        }
    }

    // Cria a aba temporária com o Spinner
    function createLoadingTab(fileId, fileName) {
        const tabBar = document.getElementById('tabBar');
        const addBtn = document.getElementById('addTabBtn');
        
        const btn = document.createElement('button');
        btn.className = 'tab-button loading';
        btn.id = `btn_${fileId}`;
        btn.innerHTML = `<span class="spinner"></span> ${fileName}`;
        
        // Insere a nova aba sempre ANTES do botão "+"
        tabBar.insertBefore(btn, addBtn);
        
        // Foca visualmente na aba que está carregando se não houver outra ativa
        if (!activeTabId) {
            btn.classList.add('active');
        }
    }

    // Atualiza a aba quando o n8n devolve o JSON perfeitamente
    function updateTabSuccess(fileId, fileName, data) {
        const btn = document.getElementById(`btn_${fileId}`);
        btn.className = 'tab-button'; // Remove o 'loading'
        
        // Adiciona o nome do arquivo e o botão "x" (com stopPropagation para não ativar a aba ao clicar no X)
        btn.innerHTML = `${fileName} <span class="close-tab" onclick="event.stopPropagation(); closeTab('${fileId}')" title="Remover Extrato">✖</span>`;
        btn.onclick = () => switchTab(fileId);

        // Cria a área de conteúdo (formulário)
        const tabsContainer = document.getElementById('tabsContainer');
        const contentDiv = document.createElement('div');
        contentDiv.className = 'tab-content';
        contentDiv.id = `content_${fileId}`;

        // Lógica de renderização das tabelas e inputs baseada no JSON recebido
        for (const [key, value] of Object.entries(data)) {
            const group = document.createElement('div');
            group.className = 'form-group';
            const label = document.createElement('label');
            label.innerText = key.replace(/_/g, ' ').toUpperCase();
            group.appendChild(label);

            if (Array.isArray(value) && value.length > 0 && typeof value[0] === 'object') {
                const table = document.createElement('table');
                table.className = 'data-table';
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                const columns = Object.keys(value[0]);
                
                columns.forEach(col => {
                    const th = document.createElement('th');
                    th.innerText = col.replace(/_/g, ' ').toUpperCase();
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                value.forEach((rowObj, rowIndex) => {
                    const tr = document.createElement('tr');
                    columns.forEach(col => {
                        const td = document.createElement('td');
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = rowObj[col] !== null && rowObj[col] !== undefined ? rowObj[col] : '';
                        input.onchange = (e) => { allExtractedData[fileId].data[key][rowIndex][col] = e.target.value; };
                        td.appendChild(input);
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                group.appendChild(table);
            } else if (typeof value !== 'object') {
                const input = document.createElement('input');
                input.type = 'text';
                input.value = value;
                input.onchange = (e) => { allExtractedData[fileId].data[key] = isNaN(e.target.value) ? e.target.value : Number(e.target.value); };
                group.appendChild(input);
            }
            contentDiv.appendChild(group);
        }
        tabsContainer.appendChild(contentDiv);
        
        // Se a aba estava ativa visualmente durante o loading, garante que o conteúdo apareça
        if (activeTabId === fileId || document.querySelectorAll('.tab-content.active').length === 0) {
            switchTab(fileId);
        }
    }

    // Sinaliza na aba se o processamento falhou
    function updateTabError(fileId, fileName) {
        const btn = document.getElementById(`btn_${fileId}`);
        btn.className = 'tab-button';
        btn.style.backgroundColor = '#fadbd8'; // Fundo avermelhado
        btn.style.color = '#c0392b';
        btn.innerHTML = `Erro: ${fileName} <span class="close-tab" onclick="event.stopPropagation(); closeTab('${fileId}')">✖</span>`;
    }

    function switchTab(fileId) {
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        const targetBtn = document.getElementById(`btn_${fileId}`);
        const targetContent = document.getElementById(`content_${fileId}`);
        
        if (targetBtn) targetBtn.classList.add('active');
        if (targetContent) targetContent.classList.add('active');
        
        activeTabId = fileId;
    }

    // Função engatilhada pelo "X" da aba
    function closeTab(fileId) {
        // Remove do HTML
        const btn = document.getElementById(`btn_${fileId}`);
        const content = document.getElementById(`content_${fileId}`);
        if (btn) btn.remove();
        if (content) content.remove();
        
        // Remove dos dados
        if (allExtractedData[fileId]) delete allExtractedData[fileId];

        // Se fechamos a aba que estava aberta, precisamos focar em outra
        if (activeTabId === fileId) {
            activeTabId = null;
            const remainingTabs = Object.keys(allExtractedData);
            if (remainingTabs.length > 0) {
                switchTab(remainingTabs[remainingTabs.length - 1]); // Pula para a última aba disponível
            } else {
                // Esconde botões se não sobrou nenhuma aba com sucesso
                document.getElementById('actionButtons').style.display = 'none';
            }
        }
    }

    // Envio para o n8n
    async function sendDecision(status) {
        if (!activeTabId || !allExtractedData[activeTabId]) return;

        const actionLoader = document.getElementById('actionLoader');
        actionLoader.style.display = 'block';
        
        const fileData = allExtractedData[activeTabId];
        const payload = {
            fileName: fileData.fileName,
            status: status,
            dados_revisados: fileData.data
        };

        try {
            const response = await fetch(N8N_URL_DECISION, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                // Usa a mesma função do "X" para remover a aba após processamento
                closeTab(activeTabId);
            } else {
                throw new Error('Erro na comunicação');
            }
        } catch (error) {
            console.error('Erro:', error);
            alert('Falha ao enviar decisão para o n8n.');
        } finally {
            actionLoader.style.display = 'none';
        }
    }
</script>

</body>
</html>
